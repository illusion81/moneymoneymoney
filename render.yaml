# Deploy the Wealth Tower API on Render.
#
#   1. render.com -> New -> Blueprint -> connect this repo -> pick this file
#   2. Add env vars in the dashboard if you want live bank data:
#        BASIQ_API_KEY, BASIQ_USER_ID
#      Leave them out and it serves the seeded mock data, which is fine.
#
# Free tier sleeps after ~15 min idle and takes 30-50s to wake. Good enough for
# teammates to build against; do NOT rely on it during the pitch — run the
# backend locally for that.
services:
  - type: web
    name: wealth-tower-api
    runtime: python
    plan: free
    # NOTE: no rootDir here. Render validates rootDir against
    # ^[A-Za-z0-9-_./ ]*$ and our folder name has a comma in it
    # ("backend,dataAPI"), which that pattern rejects. Doing the cd inside the
    # commands sidesteps it without renaming the folder and breaking everyone
    # else's paths mid-hackathon.
    buildCommand: pip install -r "backend,dataAPI/requirements.txt"
    startCommand: cd "backend,dataAPI" && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      # BASIQ_API_KEY and BASIQ_USER_ID live in the "MMM" environment group so
      # the secrets are never in this file. Creating a group does NOT apply it
      # to anything — the service has to reference it, which is what this does.
      # If the group is renamed or deleted, blueprint sync fails loudly rather
      # than silently falling back to mock data.
      - fromGroup: MMM

  # ------------------------------------------------------------------ web app
  # The Flutter build. Render has no Flutter SDK, so the build clones the
  # stable channel first — that makes the first deploy slow (5-8 min) but needs
  # no Docker image and no extra account.
  #
  # API_BASE_URL is baked in at build time. If the API service is renamed or
  # redeployed under a different hostname, change it here and redeploy, or the
  # web app will keep calling the old one.
  - type: web
    name: wealth-forest-web
    runtime: static
    buildCommand: |
      set -e
      if [ ! -d "$HOME/flutter" ]; then
        git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
      fi
      export PATH="$HOME/flutter/bin:$PATH"
      flutter --version
      flutter pub get
      flutter build web --release \
        --dart-define=API_BASE_URL=https://wealth-tower-api.onrender.com
    staticPublishPath: ./build/web
    routes:
      # Single-page app: every path has to fall back to index.html or a
      # refresh on any route 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cross-Origin-Embedder-Policy
        value: credentialless
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
